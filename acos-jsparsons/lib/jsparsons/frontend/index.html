<div class="jsparsons-page">
  <h2 id="exercise-title"></h2>
  <p id="exercise-description"></p>

  <input type="hidden" id="js-parsons-id" value="">
  <div class="jsparsons-layout">
    <div>
      <h3>Drag from here</h3>
      <div id="sortableTrash" class="sortable-code"></div>
    </div>
    <div>
      <h3>Construct your solution here</h3>
      <div id="sortable" class="sortable-code"></div>
    </div>
  </div>
  <div style="clear:both;"></div>
  <p class="jsparsons-actions">
    <a href="#" id="newInstanceLink">New instance</a>
    <a href="#" id="feedbackLink">Get feedback</a>
  </p>
  <div id="instructions"></div>
</div>

<script src="/static/{{PROTOCOL_STATIC}}/jquery.min.js" type="text/javascript"></script>
<script src="/static/{{PROTOCOL_STATIC}}/events.js" type="text/javascript"></script>
<script src="/static/jsparsons/js-parsons/lib/prettify.js"></script>
<script src="/static/jsparsons/js-parsons/lib/jquery.min.js"></script>
<script src="/static/jsparsons/js-parsons/lib/jquery-ui.min.js"></script>
<script src="/static/jsparsons/js-parsons/lib/underscore-min.js"></script>
<script src="/static/jsparsons/js-parsons/lib/lis.js"></script>
<script src="/static/jsparsons/js-parsons/lib/skulpt.js"></script>
<script src="/static/jsparsons/js-parsons/lib/skulpt-stdlib.js"></script>
<script src="/static/jsparsons/acos-jsparsons.js" type="text/javascript"></script>
<link href="/static/jsparsons/js-parsons/lib/prettify.css" rel="stylesheet">
<link href="/static/jsparsons/js-parsons/parsons.css" rel="stylesheet">
<script src="/static/jsparsons/js-parsons/parsons.js" type="text/javascript"></script>

<script>
  window.JSPARSONS_EXERCISE = {{EXERCISE_JSON}};
  window.JSPARSONS_META = {{META_JSON}};

  $(document).ready(function() {
    var exercise = window.JSPARSONS_EXERCISE || {};

    $("#exercise-title").text(exercise.name || "");
    $("#exercise-description").text(exercise.description || "");
    $("#instructions").text(exercise.instructions || "");
    $("#js-parsons-id").val(exercise.name || "");

    parson = new ParsonsWidget({
      sortableId: "sortable",
      trashId: "sortableTrash",
      max_wrong_lines: 1,
      feedback_cb: function() {}
    });

    parson.init(exercise.initial || "");
    parson.shuffleLines();
    attachParsonsPedagogicalLogging();

    $("#newInstanceLink").click(function(event) {
      event.preventDefault();
      parson.shuffleLines();
      attachParsonsPedagogicalLogging();
      sendPedagogicalLog("parsons_reset", {
        trigger: "new_instance_click"
      });
    });

    $("#feedbackLink").click(function(event) {
      event.preventDefault();
      var fb = parson.getFeedback();
      // Support both feedback shapes used by different js-parsons versions.
      var feedback = fb && fb.errors ? fb.errors : fb;
      parsonsGrade(feedback);
      displayErrors(feedback);
    });
  });
</script>
