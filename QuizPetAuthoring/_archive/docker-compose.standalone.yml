version: '3.8'
# Standalone-only compose file for QuizPetAuthoring (independent from acos-server).
# Do not use this file for the integrated acos-server deployment.
# Current runtime behavior is not fully verified; use with caution.
# Change container names and host ports to avoid conflicts with the main
# deploy/ec2 integrated stack.
services:
  mysql:
    image: mariadb:10.5
    container_name: quizpet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql-data:/var/lib/mysql
      # init-db.sql will be copied and executed manually to avoid permission issues
    ports:
      - "3306:3306"

  tomcat:
    build:
      context: .             
      dockerfile: Dockerfile.standalone
    image: quizpet-authoring-tomcat:local
    container_name: quizpet-tomcat
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "18080:8080"
    # No host mount for webapps to avoid permission issues; copy WAR into container instead.
    environment:
      - CATALINA_OPTS=-Djava.security.egd=file:/dev/./urandom

volumes:
  mysql-data:

