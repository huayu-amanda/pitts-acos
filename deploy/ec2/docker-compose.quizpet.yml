services:
  quizpet-mysql:
    build:
      context: ../..
      dockerfile: deploy/ec2/mariadb/Dockerfile
    image: quizpet-mariadb:10.5-init
    container_name: quizpet-mysql
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"

  quizpet-tomcat:
    build:
      context: ../../QuizPetAuthoring
      dockerfile: Dockerfile.ec2
    image: quizpet-authoring:standalone
    container_name: quizpet-tomcat
    restart: unless-stopped
    depends_on:
      - quizpet-mysql
    environment:
      CATALINA_OPTS: -Djava.security.egd=file:/dev/./urandom
    ports:
      - "18080:8080"

volumes:
  mysql-data: