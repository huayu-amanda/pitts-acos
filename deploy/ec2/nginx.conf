server {
  listen 80;

  client_max_body_size 10m;

  # Normalize missing trailing slash
  location = /quizpet {
    return 301 /quizpet/;
  }

  # QuizPetAuthoring (Tomcat WAR mounted at /quizpet)
  location /quizpet/ {
    proxy_pass http://quizpet-tomcat:8080;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # Everything else goes to acos-server (serves /html/* and /static/* and handles /.../event)
  location / {
    proxy_pass http://acos-server:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }
}
