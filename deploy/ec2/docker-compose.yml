services:
  # EC2 reverse proxy is disabled for local Docker usage.
  # nginx:
  #   image: nginx:1.27-alpine
  #   container_name: quizpet-nginx
  #   restart: unless-stopped
  #   depends_on:
  #     - acos-server
  #     - quizpet-tomcat
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf

  quizpet-mysql:
    image: mariadb:10.5
    container_name: quizpet-mysql
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../QuizPetAuthoring/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    # Keep DB off the public internet; use SSH/SSM port-forward when you need access.
    ports:
      - "127.0.0.1:3306:3306"

  quizpet-tomcat:
    build:
      context: ../../QuizPetAuthoring
      dockerfile: Dockerfile.ec2
    image: quizpet-tomcat:ec2
    container_name: quizpet-tomcat
    restart: unless-stopped
    depends_on:
      - quizpet-mysql
    environment:
      - CATALINA_OPTS=-Djava.security.egd=file:/dev/./urandom

  acos-server:
    build:
      context: ../..
      dockerfile: acos-server/Dockerfile
    image: acos-server:local
    container_name: acos-server
    restart: unless-stopped
    depends_on:
      - quizpet-tomcat
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      LTI_CONSUMER_KEY: ${LTI_CONSUMER_KEY:-acos}
      LTI_CONSUMER_SECRET: ${LTI_CONSUMER_SECRET:-acos}
      # Runtime-selectable QuizPet endpoint and credentials.
      # Use: docker compose --env-file ./env/local.env up -d
      QUIZPET_BASE_URL: ${QUIZPET_BASE_URL}
      QUIZPET_USERNAME: ${QUIZPET_USERNAME}
      QUIZPET_PASSWORD: ${QUIZPET_PASSWORD}
      # Dual-source generator configs (both pages can coexist):
      # /quizpet-generator       -> *_LOCAL (uses *_ADMIN credentials)
      # /quizpet-generator-pitts -> *_PITTS
      QUIZPET_BASE_URL_LOCAL: ${QUIZPET_BASE_URL_LOCAL}
      QUIZPET_USERNAME_LOCAL: ${QUIZPET_USERNAME_LOCAL}
      QUIZPET_PASSWORD_LOCAL: ${QUIZPET_PASSWORD_LOCAL}
      QUIZPET_BASE_URL_PITTS: ${QUIZPET_BASE_URL_PITTS}
      QUIZPET_USERNAME_PITTS: ${QUIZPET_USERNAME_PITTS}
      QUIZPET_PASSWORD_PITTS: ${QUIZPET_PASSWORD_PITTS}
      # Admin and student account configs (load from env file):
      # /quizpet-generator uses adminuser for quiz authoring/loading
      # Student quiz pages (/html/jstracing/*) use testuser as default
      QUIZPET_USERNAME_ADMIN: ${QUIZPET_USERNAME_ADMIN}
      QUIZPET_PASSWORD_ADMIN: ${QUIZPET_PASSWORD_ADMIN}
      QUIZPET_USERNAME_STUDENT: ${QUIZPET_USERNAME_STUDENT}
      QUIZPET_PASSWORD_STUDENT: ${QUIZPET_PASSWORD_STUDENT}
      # Optional: make generated URLs point to your public IP (recommended when using nginx on port 80)
      # SERVER_ADDRESS: http://<EC2_PUBLIC_IP>/

volumes:
  mysql-data:
