<div id="app">
    <header class="header">
      <div class="header-left">
        <h1>JSTracing</h1>
        <div class="status" id="pyodide-status">Loading runtime...</div>
      </div>
    </header>

    <div class="ide">
      <section class="panel">
        <div class="exercise-description" id="exercise-desc">
        </div>

        <div id="code-tabs" class="code-tabs" aria-label="Code files"></div>
        <div class="code-tab-content">
          <textarea id="code-editor" spellcheck="false"></textarea>

          <div id="answer-group">
            <div class="answer-title">What is your the output ?</div>

            <div class="answer-note">
              Be careful of whitespace(space, newline) in your answer.
            </div>

            <div class="answer-submit-row">
              <textarea id="answer-input" spellcheck="false" placeholder="Type your answer here..."></textarea>
              <button id="run-btn" class="primary">Submit</button>
            </div>

            <div class="result-row-inline">
              <span class="result-prefix">Result:</span>
              <span class="result-value" id="run-result"></span>
            </div>
          </div>
        </div>
      </section>
    </div>
</div>

<!-- 由后端注入练习数据：runtime.js 中用 EXERCISE_JSON 替换 -->
<script>
  window.JSTRACING_ASSET_VERSION = "20260420-mainthread-cheerpj-1";
  // 这里的 {{EXERCISE_JSON}} 会在服务器端被替换为一个 JSON 字符串，
  // 例如：{"title":"...","description":"..."}
  // 注意：不要给它再加引号，后端已经做了 JSON.stringify。
  window.JSTRACING_EXERCISE = {{EXERCISE_JSON}};
  window.JSTRACING_SESSION = {{SESSION_JSON}};
  window.JSTRACING_META = {{META_JSON}};
</script>

<!-- Centralized runtime config (Python keeps using this) -->
<script src="/static/jstracing/js/runtime-config.js?v=20260420-mainthread-cheerpj-1"></script>

<!-- Pyodide (Python in the browser, loaded from centralized config) -->
<script>
  (function () {
    var runtime = window.JSTRACING_RUNTIME || {};
    var pyodide = runtime.pyodide || {};
    var src = pyodide.scriptURL || "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js";
    var script = document.createElement("script");
    script.src = src;
    document.head.appendChild(script);
  })();
</script>

<div id="java-console-wrap" style="display:none;">
  <pre id="console"></pre>
  <div id="cheerpjDisplay"></div>
</div>

<!-- 前端逻辑脚本（使用 window.JSTRACING_EXERCISE） -->
<script src="/static/jstracing/js/jstracing.js?v=20260420-mainthread-cheerpj-1"></script>
