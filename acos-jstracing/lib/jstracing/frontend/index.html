<div id="app">
    <header class="header">
      <div class="header-left">
        <h1>JSTracing</h1>
      </div>
      <div class="status" id="pyodide-status">Loading Pyodide...</div>
    </header>

    <div class="ide">
      <section class="panel">
        <div class="panel-header">
          <h2>Python</h2>
          <div class="actions">
            <button id="save-btn" class="secondary">Save</button>
          </div>
        </div>

        <div class="exercise-labels">
          <div class="exercise-label">
            <div class="exercise-label-name">Title</div>
            <div class="exercise-label-value" id="exercise-title"></div>
          </div>
          <div class="exercise-label">
            <div class="exercise-label-name">Description</div>
            <div class="exercise-label-value" id="exercise-desc"></div>
          </div>
        </div>

        <textarea id="code-editor" spellcheck="false"></textarea>
      </section>

      <section class="panel">
        <div class="boxed-group" id="answer-group">
          <div class="boxed-group-header">
            <div class="boxed-title">Input your answer</div>
            <div class="boxed-actions">
              <button id="run-btn" class="primary">Run</button>
            </div>
          </div>

          <div class="result-row">
            <div class="result-right">
              <span class="result-prefix">Result:</span>
              <span class="result-value" id="run-result"></span>
            </div>
          </div>

          <textarea id="answer-input" spellcheck="false" placeholder="Type your answer here..."></textarea>
        </div>

        <div class="boxed-group" id="expect-group">
          <div class="boxed-group-header">
            <div class="boxed-title">Expect Result</div>
            <div class="boxed-actions">
              <button id="check-btn" class="secondary">Check</button>
            </div>
          </div>
          <pre id="expected-output" class="expect-output"></pre>
        </div>
      </section>
    </div>

    <section class="panel question-panel">
      <div class="panel-header">
        <h2>Question</h2>
      </div>
      <p id="exercise-question"></p>
    </section>
</div>

<!-- 由后端注入练习数据：lib/jstracing/index.js 中用 EXERCISE_JSON 替换 -->
<script>
  // 这里的 {{EXERCISE_JSON}} 会在服务器端被替换为一个 JSON 字符串，
  // 例如：{"title":"...","description":"..."}
  // 注意：不要给它再加引号，后端已经做了 JSON.stringify。
  window.JSTRACING_EXERCISE = {{EXERCISE_JSON}};
  window.JSTRACING_SESSION = {{SESSION_JSON}};
  window.JSTRACING_META = {{META_JSON}};
</script>

<!-- Pyodide (Python in the browser) -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>

<!-- 前端逻辑脚本（使用 window.JSTRACING_EXERCISE） -->
<script src="/static/jstracing/jstracing.js"></script>
